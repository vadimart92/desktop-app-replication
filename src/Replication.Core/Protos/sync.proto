// gRPC contract between a client and an owner (design/sync-design.md, section 6).
// The client always opens every call; the owner never connects to a client.
// All versions, cursors and seq numbers are int64 (section 5.3, "32-bit number on the way").
syntax = "proto3";

package replication;

option csharp_namespace = "Replication.Protocol";

service Sync {
  rpc Snapshot (SnapshotRequest) returns (stream SnapshotChunk);
  rpc Subscribe (stream SubscribeMessage) returns (stream ChangeMessage);
  rpc Apply (ApplyRequest) returns (ApplyReply);
  // Who is at this address: the client picks its replica of this owner by the instance_id before it opens Subscribe.
  rpc Identity (IdentityRequest) returns (IdentityReply);
}

// A column value with the SQLite storage class kept as is. An unset oneof is NULL.
message Value {
  oneof v {
    int64 i = 1;
    double d = 2;
    string s = 3;
    bytes b = 4;
  }
}

// ---------- Subscribe: client -> owner ----------

message SubscribeMessage {
  oneof body {
    Start start = 1;
    OpenTables open_tables = 2;
    Ack ack = 3;
  }
}

// Handshake is the first message of the stream (6.2).
message Start {
  string client_id = 1;
  int32 schema_version = 2;
  string instance_id = 3;           // the owner's instance from Identity
  repeated TableCursor cursors = 4;
  repeated string open_tables = 5;
  // All cursors empty (a new replica): catch-up from zero instead of SnapshotRequired. Any other reason for a snapshot
  // (different instance, cursor behind purged_version or ahead of head) still gets SnapshotRequired.
  bool skip_snapshot_on_empty_replica = 6;
}

// Cursor C plus received ranges (lo, hi] above C. Ranges are delta-encoded:
// lo1 - C, hi1 - lo1, lo2 - hi1, hi2 - lo2, ... in ascending order (6.4).
message TableCursor {
  string tbl = 1;
  int64 cursor = 2;
  repeated sint64 range_deltas = 3;
}

message OpenTables {
  repeated string tables = 1;
}

message Ack {
  repeated TableCursor cursors = 1;  // ranges are not sent in Ack
  repeated RowRef need_full = 2;
}

message RowRef {
  string tbl = 1;
  bytes pk = 2;                      // 16-byte GUID
}

// ---------- Subscribe: owner -> client ----------

message ChangeMessage {
  repeated RangeExtra extra = 1;     // empty ranges closed on the owner side (6.4, "empty ranges")
  oneof body {
    Batch batch = 2;
    TableSynced table_synced = 3;
    Head head = 4;
    Progress progress = 5;
    SnapshotRequired snapshot_required = 6;
    SchemaMismatch schema_mismatch = 7;
  }
  reserved 8;                        // was `Accepted accepted = 8`, removed: never reuse the number
}

message RangeExtra {
  string tbl = 1;
  int64 lo = 2;
  int64 hi = 3;
}

message Batch {
  string tbl = 1;
  repeated RangeExtra covers = 2;    // ranges this batch closes for the table
  repeated string columns = 3;       // data columns of the table, once per batch
  repeated Row rows = 4;
  repeated Tombstone tombstones = 5;
  bool online = 6;
  int64 remaining = 7;               // estimated changes left in catch-up
}

message Row {
  bytes pk = 1;
  int64 version = 2;
  bool full = 3;                     // full row: values of all `columns`
  int64 mask = 4;                    // partial row: bits of `columns` that `values` carry, in column order
  repeated Value values = 5;
}

message Tombstone {
  bytes pk = 1;
  int64 version = 2;
}

message TableSynced {
  string tbl = 1;
  int64 version = 2;
}

message Head {
  int64 version = 1;
}

message Progress {
  int64 remaining = 1;
  bool done = 2;
  int64 owner_time_unix = 3;         // set by the owner; the client does not read it
}

message SnapshotRequired {
  string reason = 1;
  int64 size_bytes = 2;
  string instance_id = 3;            // the instance that answers: equal to the client's one = refill it, other = the client adopts that owner on the next round
}

message SchemaMismatch {
  int32 owner_schema_version = 1;
}

// ---------- Snapshot ----------

message SnapshotRequest {
  string client_id = 1;
  string snapshot_id = 2;            // empty for a new snapshot
  int64 offset = 3;
}

message SnapshotChunk {
  string snapshot_id = 1;
  int64 offset = 2;
  int64 total_size = 3;
  bytes data = 4;
  int64 version = 5;
  string instance_id = 6;            // the client does not read it: the instance comes from the snapshot's _sync_meta
  bytes sha256 = 7;                  // hash of the whole file, in every chunk
}

// ---------- Apply ----------

message ApplyRequest {
  string client_id = 1;
  repeated Action actions = 2;
}

enum ActionKind {
  ACTION_KIND_UNSPECIFIED = 0;
  CREATE = 1;
  PATCH = 2;
  DELETE = 3;
  ARCHIVE = 4;
  PREDICATE_DELETE = 5;
}

message Action {
  int64 seq = 1;
  string tbl = 2;
  bytes pk = 3;
  ActionKind kind = 4;
  repeated string columns = 5;
  repeated Value values = 6;
  repeated Condition predicate = 7;  // PREDICATE_DELETE: column = value, ANDed
  int64 expected_version = 8;        // ARCHIVE / PREDICATE_DELETE: V, the replica is complete up to V
  repeated RowRef rows = 9;          // ARCHIVE: the set with its FK closure
}

message Condition {
  string column = 1;
  Value value = 2;
}

enum ResultStatus {
  RESULT_STATUS_UNSPECIFIED = 0;
  APPLIED = 1;
  SKIPPED = 2;
  REJECTED = 3;
  IGNORED = 4;
}

message ActionResult {
  int64 seq = 1;
  ResultStatus status = 2;
  string reason = 3;
  bool has_version = 4;
  int64 version = 5;
  repeated RowRef changed = 6;       // not deleted: changed after V
  repeated RowRef children = 7;      // not deleted: has children that stay on the owner
  int32 deleted = 8;                 // rows removed by the action; the client does not read it
}

message ApplyReply {
  int64 applied_up_to_seq = 1;
  repeated ActionResult results = 2;
}

message IdentityRequest {}

message IdentityReply {
  string instance_id = 1;
}
